	<h2>Javascripts change content</h2>
	<p id="Data1">This is my first content</p>
	<button type="button" onclick='document.getElementById("Data1").innerHTML="This is my second Data"'>Click Here</button>

	<h2>Javascripts change style</h2>
	<p id="style1">I use javascipts to change the style of my content</p>
	<script>

		function mystyle()
		{
			document.getElementById("style1").style.
			       fontSize="40px";

			       document.getElementById("style1").style.color="yellow";

			       document.getElementById("style1").style.backgroundColor="pink";

			       document.getElementById("style1").style.fontFamily="Lucida";





         }



	</script>

	<button type="button" onclick="mystyle()">Tekey Sini</button>


	<h3>Javascripts manipulate image</h3>
	<script>

		function myImage(a)
		{

			var pict;
			if(a==1)
			{
				pict="image/baju_2.jpg"

			}
			else
			{
				pict="image/baju_1.jpg"


			}
			document.getElementById('gambar').src=pict;






		}

	</script>
	<img src="image/baju_2.jpg" width="150" height="170" id="gambar">
	<p>
		<button type="button" onclick="myImage(1)">Gambar Sini</button>
		<button type="button" onclick="myImage(2)">Gambar Comel</button>


	</p>
